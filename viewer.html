<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset Viewer</title>
<style>
  html, body { height: 100%; margin: 0; background: #e8b877; overflow: hidden; font: 13px system-ui, sans-serif; color: #2b1a08; }
  canvas { display: block; width: 100%; height: 100%; }
  #bar { position: fixed; left: 12px; top: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, button, a { font: 600 12px system-ui, sans-serif; padding: 7px 10px; border-radius: 8px; border: 2px solid #2b1a08; background: #f5d7a8; color: #2b1a08; cursor: pointer; text-decoration: none; }
  #info { position: fixed; left: 12px; bottom: 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar">
  <select id="pick"></select>
  <button id="gamecam">Game camera</button>
  <button id="anim">Animate: ON</button>
  <a href="index.html">Play</a>
</div>
<div id="info"></div>
<script type="module" src="/src/viewer.js"></script>
</body>
</html>
